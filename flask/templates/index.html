<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pneumonia Scanner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .upload-container {
            margin-top: 50px;
        }
        .result-container {
            margin-top: 30px;
        }
        .img-preview {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            padding: 5px;
            background-color: #fff;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container upload-container">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <h1 class="mb-4">Pneumonia Scanner</h1>
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <input class="form-control" type="file" name="image" accept="image/*" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload & Predict</button>
                </form>
                
                {% if original_img and prediction %}
                <div class="result-container mt-5">
                    <h3>Result</h3>
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <img src="{{ original_img }}" alt="Yüklenen Resim" class="img-preview">
                        </div>
                    </div>
                    <div class="mt-3">
                        <h4>{{ prediction }}</h4>
                    </div>
                </div>
                {% endif %}
            </div>
        </div>
    </div>

    <!-- Bootstrap JS ve bağımlılıkları -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
